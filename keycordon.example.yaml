# keycordon configuration. Every key is optional; the values below are the
# defaults. Start with: keycordon serve -config keycordon.yaml

listen: 127.0.0.1:8318             # clients point their base URL here
upstream: http://127.0.0.1:8317    # CLIProxyAPI or any OpenAI/Anthropic/Gemini compatible endpoint
mode: enforce                      # enforce: replace + restore; observe: log findings only
preserve_host: false
insecure_skip_verify: false

# Memory is concurrency × these limits: requests run in parallel, so 100
# concurrent 64 MiB bodies is 6.4 GiB. Size them for your machine, or cap the
# container, rather than serialising requests.
#
# For scale: a 2M-token text request is 3-11 MiB depending on the content
# (~1.5 bytes/token for Chinese, ~4.0 for English, ~4.8 for JSON), so 8 MiB
# covers every text-only request including Grok's 2M context.
#
# Raise these if you get a 413:
#   - several images in one request: a model bills images per tile, so ten
#     4 MiB PNGs is a 53 MiB body for only a few thousand tokens
#   - a 2M-token request made almost entirely of JSON or dense code
# Remember that memory is concurrency x max_decoded_bytes (see design 11.4).
limits:
  max_body_bytes: 8388608          # 8 MiB as received; over => 413
  max_decoded_bytes: 16777216      # 16 MiB after Content-Encoding is removed; over => 413
  max_response_bytes: 16777216     # larger non-streaming responses are passed through unrestored
  max_json_depth: 128              # nesting, including JSON inside strings; over => 400
  scan_timeout: 2s                 # exceeded => 503, the request is never forwarded unscanned

protocols:
  enabled: []                      # adapter IDs to keep; empty = all (see `keycordon adapters`)
  extra_dir: ~/.config/keycordon/protocols   # extra/overriding adapter YAML files
  unsupported_ai_policy: reject    # reject | passthrough (WebSocket, realtime)
  detect_unregistered: true        # warn when an unregistered endpoint receives AI-looking JSON

request:
  inject_instruction: true         # tell the model what placeholders are
  inject_always: true              # inject on every filtered request so the prompt prefix never changes

detector:
  rules_file: ""                   # empty = embedded rules (betterleaks defaults + keycordon rules)
  max_decode_depth: 2              # look inside base64 / hex / percent / unicode escapes
  min_value_length: 8

restore:
  enabled: true

caller:
  require_on_non_loopback: true    # non-loopback listeners need a client credential (401 otherwise)

vault:
  master_key_scope: file           # file | env | process
  master_key_file: ~/.config/keycordon/master.key   # generated on first start, mode 0600
  master_key_env: KEYCORDON_MASTER_KEY              # hex or base64, >= 32 bytes; wins over the file
  max_entries_per_caller: 10000
  max_sent_texts: 65536            # texts whose spans are frozen (design 7.8)
  idle_ttl: 24h

log:
  level: info                      # debug | info | warn | error
  format: text                     # text | json
