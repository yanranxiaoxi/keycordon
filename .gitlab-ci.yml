stages:
  - test
  - build
  - package
  - upload
  - docker

# 流水线策略：
#   - 默认分支的 push：nightly（可执行文件 + 镜像，都是 nightly）
#   - 打 vX.Y.Z 标签：release（可执行文件 + 镜像，都是发布版本）
#   - Merge Request、其它分支的 push 一律不创建流水线，
#     因此不可能触发任何构建或上传
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

variables:
  # CI runner 在境外，用官方默认代理与校验库。
  # 这两个可以在 GitLab 项目变量里覆盖（runner 在国内时改成 goproxy.cn）。
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  GOFLAGS: -mod=mod
  CONTAINER_IMAGE_NAME: keycordon
  # 软件包仓库里的包名
  PACKAGE_NAME: keycordon

# #######################
#          test         #
# #######################

go-test:
  stage: test
  tags:
    - linux
    - docker
  # Debian 版自带 gcc，-race 需要的 cgo 可以直接用；alpine 还要额外装 musl-dev
  image: docker.io/library/golang:1.27
  cache:
    key:
      files:
        - go.sum
    paths:
      - .gocache/
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
  script:
    - go build ./...
    - go vet ./...
    - test -z "$(gofmt -l .)" || { echo "以下文件未格式化："; gofmt -l .; exit 1; }
    - go test -race -count=1 ./... 2>&1 | tee go-test.log
    # 检测质量门槛（precision/recall 各 0.95），失败说明规则或评估集需要更新
    - go test ./internal/detector -run 'EmbeddedRuleTests|EvalCorpus' -v 2>&1 | tee eval.log
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - go-test.log
      - eval.log

# #######################
#         build         #
# #######################
#
# 每个平台一个 job，产物直接按「keycordon_<版本>_<os>_<arch>[.exe]」命名，
# package 阶段的 checksums 与 upload 靠这个前缀收集。用 .build 作模板，
# 每个平台只写三个变量。

.build:
  stage: build
  tags:
    - linux
    - docker
  image: docker.io/library/golang:1.27
  cache:
    key:
      files:
        - go.sum
    paths:
      - .gocache/
  # extends 会深合并 variables：各平台的 GOOS/GOARCH/EXT 与这里的 GOCACHE 并存
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
  # 测试不过就不该产出可执行文件
  needs:
    - job: go-test
  script:
    # 两个版本号：
    #   BINARY_VERSION  编进二进制，`keycordon version` 能看到确切是哪次构建
    #   PACKAGE_VERSION 软件包仓库的目录名与文件名前缀
    # nightly 的包目录固定叫 nightly，每次覆盖同一个包，不会越积越多。
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        BINARY_VERSION="${CI_COMMIT_TAG#v}"
        PACKAGE_VERSION="${BINARY_VERSION}"
      else
        BINARY_VERSION="0.0.0-${CI_COMMIT_SHORT_SHA}"
        PACKAGE_VERSION="nightly"
      fi
      echo "二进制版本 ${BINARY_VERSION}，软件包版本 ${PACKAGE_VERSION}"
    - mkdir -p dist
    # -trimpath 去掉本地路径；-buildvcs=false 让没有 git 元数据的浅克隆也能构建
    # 折成一行：YAML 的续行会把换行和缩进原样交给 shell，多行命令要写成
    # 单个 script 条目，否则 `go build` 会缺参数。
    - GOOS=${GOOS} GOARCH=${GOARCH} CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=${BINARY_VERSION}" -o "dist/keycordon_${PACKAGE_VERSION}_${GOOS}_${GOARCH}${EXT}" ./cmd/keycordon
    # 交叉编译没法运行，但 `go version -m` 会打印二进制里记录的 GOOS/GOARCH，
    # 借此确认架构写对了（不依赖 file 命令是否存在）
    - go version -m "dist/keycordon_${PACKAGE_VERSION}_${GOOS}_${GOARCH}${EXT}" | grep -E "GOARCH|GOOS"
    - ls -l dist/
  artifacts:
    expire_in: 1 week
    paths:
      - dist/
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# nightly 的产物文件名里带 nightly（keycordon_nightly_linux_amd64），
# 每次覆盖同一个包；编进二进制的版本仍是 0.0.0-<短哈希>，`keycordon version`
# 能看出确切来源。

build-linux-amd64:
  extends: .build
  variables:
    GOOS: linux
    GOARCH: amd64
    EXT: ""

build-linux-arm64:
  extends: .build
  variables:
    GOOS: linux
    GOARCH: arm64
    EXT: ""

build-darwin-amd64:
  extends: .build
  variables:
    GOOS: darwin
    GOARCH: amd64
    EXT: ""

build-darwin-arm64:
  extends: .build
  variables:
    GOOS: darwin
    GOARCH: arm64
    EXT: ""

build-windows-amd64:
  extends: .build
  variables:
    GOOS: windows
    GOARCH: amd64
    EXT: ".exe"

build-windows-i386:
  extends: .build
  variables:
    GOOS: windows
    GOARCH: "386"
    EXT: ".exe"

build-windows-arm64:
  extends: .build
  variables:
    GOOS: windows
    GOARCH: arm64
    EXT: ".exe"

# #######################
#        checksums      #
# #######################
#
# SHA256SUMS 单独一个 job：它需要全部 7 个平台的产物，而 upload 只需要
# 下载已经汇总好的目录。用 needs 把 7 个 build job 都拉进来 —— 多个 job 的
# dist/ 产物会合并到同一个目录，文件名按平台不同，不会互相覆盖。

checksums:
  stage: package
  tags:
    - linux
    - docker
  image: docker.io/library/alpine:3.21
  needs:
    - job: build-linux-amd64
    - job: build-linux-arm64
    - job: build-darwin-amd64
    - job: build-darwin-arm64
    - job: build-windows-amd64
    - job: build-windows-i386
    - job: build-windows-arm64
  script:
    - cd dist
    - ls -l
    - sha256sum keycordon_* > SHA256SUMS
    - cat SHA256SUMS
  artifacts:
    expire_in: 1 week
    paths:
      - dist/
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# #######################
#         upload        #
# #######################
#
# 把二进制和 SHA256SUMS 推到 GitLab 软件包仓库（generic package）。
#
# 版本目录：tag 用 <X.Y.Z>，每个 tag 一个固定目录；分支固定用 nightly，
# 只有一个目录，每次覆盖 —— 与 Docker 的 nightly 规则一致：nightly 是移动的，
# tag 是固定的。这样仓库里最多只有「各发布版本 + 一个 nightly」，
# 不会因为每次提交都多一个目录而无限增长。
#
# nightly 的二进制文件名也带 nightly（keycordon_nightly_linux_amd64），
# 但编进二进制的版本仍是 0.0.0-<短哈希>，`keycordon version` 能看到确切来源。
#
# 用 CI_JOB_TOKEN，不需要额外配置凭据。

upload:
  stage: upload
  tags:
    - linux
    - docker
  # curl 镜像小；Debian 的 golang 镜像只为上传太大
  image: docker.io/curlimages/curl:latest
  needs:
    - job: checksums
  script:
    # 版本号在这里重算一次，而不是靠 dotenv artifact 从 build 传下来：
    # dotenv 只沿直接的 needs 传递，多一跳就丢了，重算 4 行更可靠。
    # 规则与 .build 一致：tag 用版本号，分支固定用 nightly。
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        PACKAGE_VERSION="${CI_COMMIT_TAG#v}"
      else
        PACKAGE_VERSION="nightly"
      fi
      echo "软件包版本 ${PACKAGE_VERSION}"
    - PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}"
    # nightly 要真正被替换掉：GitLab 默认把同名文件追加进已有包，旧文件会和
    # 新文件一起留着，体积照样长。删掉整个 nightly 包再上传，一次运行只会留下
    # 一套文件。发布版本不删：各 tag 目录互不相干，且 tag 内容不会变。
    - |
      set -e
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "发布版本：保留已有包"
      else
        echo "nightly：删除旧的 nightly 包"
        pkgs="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages"
        # 包对象以 {"id":N,"name":"<包名>" 开头；嵌套的 pipeline/user 对象
        # 第二个字段不是 name，不会误匹配。只用 grep/cut，不需要 jq。
        response=$(curl --silent --show-error --fail-with-body \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${pkgs}?package_type=generic&package_name=${PACKAGE_NAME}&package_version=${PACKAGE_VERSION}&per_page=100") \
          || { echo "查询已有 nightly 包失败：${response}" >&2; exit 1; }
        # 第一次运行时还没有 nightly 包，grep 匹配不到会返回 1；
        # 在 set -e 下这会直接中止整个 job，所以要吞掉这个返回码。
        ids=$(printf '%s' "$response" \
          | grep -o '{"id":[0-9]*,"name":"[^"]*"' | grep -o '[0-9]*' || true)
        if [ -z "$ids" ]; then
          echo "  没有旧的 nightly 包，跳过"
        fi
        for id in $ids; do
          echo "  删除包 ${id}"
          body=$(curl --silent --show-error --fail-with-body --request DELETE \
            --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            "${pkgs}/${id}") \
            || { echo "删除包 ${id} 失败：${body}" >&2; exit 1; }
        done
      fi
    - echo "上传到 ${PACKAGE_URL}"
    # --fail 让 4xx/5xx 直接失败，而不是静默"成功"
    - |
      set -e
      cd dist
      n=0
      for f in keycordon_* SHA256SUMS; do
        [ -f "$f" ] || continue
        echo "→ $f"
        # --fail-with-body：失败时把服务端的错误信息打出来，便于定位
        curl --fail-with-body --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" \
          "${PACKAGE_URL}/${f}"
        n=$((n + 1))
      done
      # 一个文件都没上传就说明 artifacts 没下来或文件名对不上，应当报错
      [ "$n" -gt 0 ] || { echo "dist/ 里没有可上传的文件" >&2; exit 1; }
      echo "已上传 ${n} 个文件"
    - echo "完成：${PACKAGE_URL}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# #######################
#         docker        #
# #######################
#
# 构建、冒烟测试、打标签、推送的实际步骤在 scripts/ci-docker.sh 里，
# 这样同一套逻辑在本地也能跑（CI 之外的调试），两边不会漂移。
# 两个 job 只在「调用哪个模式」和「什么时候跑」上不同。

# ---- nightly：默认分支的每次 push ----
# 标签 sha-<短哈希> 与 nightly，只推 Docker Hub。
# GitLab Registry 只留发布版本，避免被每天几十个临时镜像塞满。
docker-nightly:
  stage: docker
  tags:
    - linux
    - docker
    - amd64
  image: docker.io/library/docker:cli
  services:
    - name: docker.io/library/docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  needs:
    - job: go-test
  # 只在默认分支上跑。tag 流水线里 CI_COMMIT_BRANCH 为空、CI_COMMIT_TAG 有值，
  # 第一条规则把发布排除在外，避免带着空 tag 进入脚本。
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USER" --password-stdin docker.io
  script:
    # 第二次确认：脚本自己也检查 CI_COMMIT_BRANCH == CI_DEFAULT_BRANCH，
    # 手动触发或规则改动都不会让 nightly 指向功能分支
    - ./scripts/ci-docker.sh nightly

# ---- release：vX.Y.Z 标签 ----
# 标签 <版本号>、<次版本号>、latest，推 Docker Hub 与 GitLab Registry。
# latest 始终指向最新的发布版本；nightly 始终指向最新的 git 构建。
docker-release:
  stage: docker
  tags:
    - linux
    - docker
    - amd64
  image: docker.io/library/docker:cli
  services:
    - name: docker.io/library/docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  needs:
    - job: go-test
  # 只在 vX.Y.Z 标签上跑。分支 push 没有 tag，CI_COMMIT_TAG 为空，这条
  # 规则把它排除在外，避免像上一次那样带着空 tag 进入脚本。
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USER" --password-stdin docker.io
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - ./scripts/ci-docker.sh release
