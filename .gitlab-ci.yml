stages:
  - test
  - docker

# 流水线策略：
#   - 默认分支的 push：nightly 构建（sha-<短哈希> + nightly，只推 Docker Hub）
#   - 打 vX.Y.Z 标签：release 构建（版本号 + 次版本号 + latest，推两个仓库）
#   - Merge Request、其它分支的 push 一律不创建流水线，
#     因此不可能触发任何镜像构建或推送
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

variables:
  # CI runner 在境外，用官方默认代理与校验库。
  # 这两个可以在 GitLab 项目变量里覆盖（runner 在国内时改成 goproxy.cn）。
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  GOFLAGS: -mod=mod
  CONTAINER_IMAGE_NAME: keycordon

# #######################
#          test         #
# #######################

go-test:
  stage: test
  tags:
    - linux
    - docker
  # Debian 版自带 gcc，-race 需要的 cgo 可以直接用；alpine 还要额外装 musl-dev
  image: docker.io/library/golang:1.27
  cache:
    key:
      files:
        - go.sum
    paths:
      - .gocache/
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
  script:
    - go build ./...
    - go vet ./...
    - test -z "$(gofmt -l .)" || { echo "以下文件未格式化："; gofmt -l .; exit 1; }
    - go test -race -count=1 ./... 2>&1 | tee go-test.log
    # 检测质量门槛（precision/recall 各 0.95），失败说明规则或评估集需要更新
    - go test ./internal/detector -run 'EmbeddedRuleTests|EvalCorpus' -v 2>&1 | tee eval.log
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - go-test.log
      - eval.log

# #######################
#         Docker        #
# #######################

# 构建、冒烟测试、打标签、推送的实际步骤在 scripts/ci-docker.sh 里，
# 这样同一套逻辑在本地也能跑（CI 之外的调试），两边不会漂移。
# 两个 job 只在「调用哪个模式」和「什么时候跑」上不同。

# ---- nightly：默认分支的每次 push ----
# 标签 sha-<短哈希> 与 nightly，只推 Docker Hub。
# GitLab Registry 只留发布版本，避免被每天几十个临时镜像塞满。
docker-nightly:
  stage: docker
  tags:
    - linux
    - docker
    - amd64
  image: docker.io/library/docker:cli
  services:
    - name: docker.io/library/docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  needs:
    - job: go-test
  before_script:
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USER" --password-stdin docker.io
  script:
    # 脚本自己检查 CI_COMMIT_BRANCH == CI_DEFAULT_BRANCH，非默认分支直接失败，
    # 避免手动触发或规则改动让 nightly 指向功能分支
    - ./scripts/ci-docker.sh nightly

# ---- release：vX.Y.Z 标签 ----
# 标签 <版本号>、<次版本号>、latest，推 Docker Hub 与 GitLab Registry。
# latest 始终指向最新的发布版本；nightly 始终指向最新的 git 构建。
docker-release:
  stage: docker
  tags:
    - linux
    - docker
    - amd64
  image: docker.io/library/docker:cli
  services:
    - name: docker.io/library/docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  needs:
    - job: go-test
  before_script:
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USER" --password-stdin docker.io
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - ./scripts/ci-docker.sh release
