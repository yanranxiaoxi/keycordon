stages:
  - test
  - docker

# 流水线策略：
#   - 默认分支的 push 创建流水线，产出 latest + sha-<短哈希>
#   - 打 vX.Y.Z 标签创建流水线，产出 X.Y.Z / X.Y / latest
#   - Merge Request、其它分支的 push 一律不创建流水线，
#     因此不可能触发任何镜像构建或推送
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

variables:
  # CI runner 在境外，用官方默认代理与校验库。
  # 这两个可以在 GitLab 项目变量里覆盖（runner 在国内时改成 goproxy.cn）。
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  GOFLAGS: -mod=mod
  CONTAINER_IMAGE_NAME: keycordon

# #######################
#          test         #
# #######################

go-test:
  stage: test
  tags:
    - linux
    - docker
  # Debian 版自带 gcc，-race 需要的 cgo 可以直接用；alpine 还要额外装 musl-dev
  image: docker.io/library/golang:1.27
  cache:
    key:
      files:
        - go.sum
    paths:
      - .gocache/
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
  script:
    - go build ./...
    - go vet ./...
    - test -z "$(gofmt -l .)" || { echo "以下文件未格式化："; gofmt -l .; exit 1; }
    - go test -race -count=1 ./... 2>&1 | tee go-test.log
    # 检测质量门槛（precision/recall 各 0.95），失败说明规则或评估集需要更新
    - go test ./internal/detector -run 'EmbeddedRuleTests|EvalCorpus' -v 2>&1 | tee eval.log
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - go-test.log
      - eval.log

# #######################
#         Docker        #
# #######################

docker-build:
  stage: docker
  tags:
    - linux
    - docker
    - amd64
  image: docker.io/library/docker:cli
  services:
    - name: docker.io/library/docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  needs:
    - job: go-test
  before_script:
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USER" --password-stdin docker.io
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # ---- 版本与标签 ----
    # tag 用去掉 v 的版本号；分支用 0.0.0-<短哈希>，与 Go 的伪版本习惯一致
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1,2)"
        TAGS="${VERSION} ${MAJOR_MINOR} latest"
      else
        VERSION="0.0.0-${CI_COMMIT_SHORT_SHA}"
        TAGS="latest sha-${CI_COMMIT_SHORT_SHA}"
      fi
      echo "构建版本：${VERSION}"
      echo "镜像标签：${TAGS}"
      printf 'VERSION=%s\nTAGS=%s\n' "$VERSION" "$TAGS" > version.env

    # ---- 构建 ----
    # --pull 保证基础镜像是最新的补丁版本
    - docker build --pull --provenance=false --sbom=false
        --build-arg "VERSION=${VERSION}"
        --build-arg "GOPROXY=${GOPROXY}"
        --build-arg "GOSUMDB=${GOSUMDB}"
        -t "${CONTAINER_IMAGE_NAME}:build" .

    # ---- 冒烟测试：镜像能启动、能打印版本、能加载全部适配器 ----
    - docker run --rm "${CONTAINER_IMAGE_NAME}:build" version
    - docker run --rm "${CONTAINER_IMAGE_NAME}:build" adapters > /dev/null

    # ---- 打标签并推送 ----
    - |
      set -e
      for tag in ${TAGS}; do
        docker tag "${CONTAINER_IMAGE_NAME}:build" "docker.io/${DOCKERHUB_USER}/${CONTAINER_IMAGE_NAME}:${tag}"
        docker tag "${CONTAINER_IMAGE_NAME}:build" "${CI_REGISTRY_IMAGE}:${tag}"
      done
      for tag in ${TAGS}; do
        echo "→ Docker Hub ${DOCKERHUB_USER}/${CONTAINER_IMAGE_NAME}:${tag}"
        docker push "docker.io/${DOCKERHUB_USER}/${CONTAINER_IMAGE_NAME}:${tag}"
        echo "→ GitLab     ${CI_REGISTRY_IMAGE}:${tag}"
        docker push "${CI_REGISTRY_IMAGE}:${tag}"
      done

    # ---- 摘要 ----
    - |
      echo "完成。"
      echo "  Docker Hub: docker.io/${DOCKERHUB_USER}/${CONTAINER_IMAGE_NAME}"
      echo "  GitLab    : ${CI_REGISTRY_IMAGE}"
      echo "  标签      : ${TAGS}"
      echo "  版本      : ${VERSION}"
  artifacts:
    expire_in: 1 day
    reports:
      dotenv: version.env
